  <text x="968" y="320" fill="#fafafa" font-family="ui-monospace, Menlo, monospace" font-size="12">production</text>
  <text x="968" y="380" fill="#525252" font-family="ui-monospace, Menlo, monospace" font-size="12">Vercel / edge</text>

  <text x="48" y="460" fill="#525252" font-family="ui-monospace, Menlo, monospace" font-size="12">copy from templates/github/ and templates/supabase/tests/ · see docs/enforcement-setup.md</text>
