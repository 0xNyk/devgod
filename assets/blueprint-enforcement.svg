  <text x="68" y="324" fill="#737373" font-family="ui-monospace, Menlo, monospace" font-size="12">typecheck · lint · scan</text>
  <text x="68" y="380" fill="#525252" font-family="ui-monospace, Menlo, monospace" font-size="12">developer machine</text>

  <text x="318" y="248" fill="#525252" font-family="ui-monospace, Menlo, monospace" font-size="18">→</text>

  <!-- L2 -->
  <rect x="348" y="88" width="250" height="320" rx="8" fill="#141414" stroke="#404040"/>
