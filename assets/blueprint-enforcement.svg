  <text x="368" y="308" fill="#737373" font-family="ui-monospace, Menlo, monospace" font-size="12">devgod:scan --strict</text>
  <text x="368" y="380" fill="#525252" font-family="ui-monospace, Menlo, monospace" font-size="12">GitHub Actions</text>

  <text x="618" y="248" fill="#525252" font-family="ui-monospace, Menlo, monospace" font-size="18">→</text>

  <!-- L3 -->
  <rect x="648" y="88" width="250" height="320" rx="8" fill="#141414" stroke="#262626"/>
