<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-label="devgod verbs">
  <rect width="1200" height="520" fill="#0a0a0a"/>
  <text x="48" y="48" fill="#fafafa" font-family="ui-monospace, Menlo, monospace" font-size="22" font-weight="600">verbs</text>
  <text x="140" y="48" fill="#737373" font-family="ui-monospace, Menlo, monospace" font-size="14">text or slash · same behavior</text>

  <text x="48" y="96" fill="#525252" font-family="ui-monospace, Menlo, monospace" font-size="12">CORE</text>

  <g font-family="ui-monospace, Menlo, monospace" font-size="13">
    <rect x="48" y="112" width="100" height="40" rx="6" fill="#141414" stroke="#404040"/><text x="98" y="137" text-anchor="middle" fill="#fafafa">build</text>
    <rect x="160" y="112" width="100" height="40" rx="6" fill="#0f0f0f" stroke="#262626"/><text x="210" y="137" text-anchor="middle" fill="#e5e5e5">plan</text>
    <rect x="272" y="112" width="100" height="40" rx="6" fill="#0f0f0f" stroke="#262626"/><text x="322" y="137" text-anchor="middle" fill="#e5e5e5">audit</text>
    <rect x="384" y="112" width="100" height="40" rx="6" fill="#0f0f0f" stroke="#262626"/><text x="434" y="137" text-anchor="middle" fill="#e5e5e5">fix</text>
    <rect x="496" y="112" width="100" height="40" rx="6" fill="#0f0f0f" stroke="#262626"/><text x="546" y="137" text-anchor="middle" fill="#e5e5e5">schema</text>
    <rect x="608" y="112" width="100" height="40" rx="6" fill="#0f0f0f" stroke="#262626"/><text x="658" y="137" text-anchor="middle" fill="#e5e5e5">page</text>
    <rect x="720" y="112" width="100" height="40" rx="6" fill="#0f0f0f" stroke="#262626"/><text x="770" y="137" text-anchor="middle" fill="#e5e5e5">design</text>
    <rect x="832" y="112" width="100" height="40" rx="6" fill="#0f0f0f" stroke="#262626"/><text x="882" y="137" text-anchor="middle" fill="#e5e5e5">api</text>
    <rect x="944" y="112" width="100" height="40" rx="6" fill="#0f0f0f" stroke="#262626"/><text x="994" y="137" text-anchor="middle" fill="#e5e5e5">flow</text>

    <rect x="48" y="168" width="100" height="40" rx="6" fill="#0f0f0f" stroke="#262626"/><text x="98" y="193" text-anchor="middle" fill="#e5e5e5">enforce</text>
    <rect x="160" y="168" width="100" height="40" rx="6" fill="#0f0f0f" stroke="#262626"/><text x="210" y="193" text-anchor="middle" fill="#e5e5e5">growth</text>
    <rect x="272" y="168" width="100" height="40" rx="6" fill="#0f0f0f" stroke="#262626"/><text x="322" y="193" text-anchor="middle" fill="#e5e5e5">agent</text>
    <rect x="384" y="168" width="100" height="40" rx="6" fill="#141414" stroke="#525252"/><text x="434" y="193" text-anchor="middle" fill="#fafafa">ship</text>
  </g>

  <text x="48" y="260" fill="#525252" font-family="ui-monospace, Menlo, monospace" font-size="12">LIFECYCLE</text>
  <rect x="48" y="276" width="1104" height="56" rx="8" fill="#0f0f0f" stroke="#262626"/>
  <text x="600" y="310" text-anchor="middle" fill="#e5e5e5" font-family="ui-monospace, Menlo, monospace" font-size="14">plan → build → audit → fix → enforce → ship</text>

  <text x="48" y="380" fill="#525252" font-family="ui-monospace, Menlo, monospace" font-size="12">PIPELINES</text>
  <g font-family="ui-monospace, Menlo, monospace" font-size="12">
    <rect x="48" y="396" width="140" height="40" rx="6" fill="#0f0f0f" stroke="#262626"/><text x="118" y="421" text-anchor="middle" fill="#a3a3a3">greenfield</text>
    <rect x="200" y="396" width="120" height="40" rx="6" fill="#0f0f0f" stroke="#262626"/><text x="260" y="421" text-anchor="middle" fill="#a3a3a3">landing</text>
    <rect x="332" y="396" width="110" height="40" rx="6" fill="#0f0f0f" stroke="#262626"/><text x="387" y="421" text-anchor="middle" fill="#a3a3a3">billing</text>
    <rect x="454" y="396" width="110" height="40" rx="6" fill="#0f0f0f" stroke="#262626"/><text x="509" y="421" text-anchor="middle" fill="#a3a3a3">privacy</text>
    <rect x="576" y="396" width="100" height="40" rx="6" fill="#0f0f0f" stroke="#262626"/><text x="626" y="421" text-anchor="middle" fill="#a3a3a3">upload</text>
    <rect x="688" y="396" width="90" height="40" rx="6" fill="#0f0f0f" stroke="#262626"/><text x="733" y="421" text-anchor="middle" fill="#a3a3a3">auth</text>
    <rect x="790" y="396" width="140" height="40" rx="6" fill="#141414" stroke="#404040"/><text x="860" y="421" text-anchor="middle" fill="#fafafa">loop-verify</text>
  </g>

  <text x="48" y="480" fill="#525252" font-family="ui-monospace, Menlo, monospace" font-size="12">examples: /devgod-plan — invitations · /devgod-audit — dashboard · /devgod-ship — production</text>
</svg>
