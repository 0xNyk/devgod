<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-label="devgod">
  <rect width="256" height="256" rx="48" fill="#0a0a0a"/>
  <!-- router: root → three module columns (progressive disclosure) -->
  <g fill="none" stroke="#fafafa" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <!-- root skill -->
    <rect x="78" y="40" width="100" height="40" rx="10"/>
    <line x1="128" y1="80" x2="128" y2="108"/>
    <!-- crossbar -->
    <line x1="48" y1="108" x2="208" y2="108"/>
    <!-- columns -->
    <line x1="48" y1="108" x2="48" y2="128"/>
    <line x1="128" y1="108" x2="128" y2="128"/>
    <line x1="208" y1="108" x2="208" y2="128"/>
    <!-- module stacks (3×2 leaves) -->
    <rect x="28" y="128" width="40" height="56" rx="10"/>
    <rect x="108" y="128" width="40" height="56" rx="10"/>
    <rect x="188" y="128" width="40" height="56" rx="10"/>
    <!-- base gates -->
    <line x1="48" y1="200" x2="48" y2="216"/>
    <line x1="128" y1="200" x2="128" y2="216"/>
    <line x1="208" y1="200" x2="208" y2="216"/>
    <line x1="40" y1="216" x2="216" y2="216"/>
  </g>
</svg>
