name: optimization evidence attestation

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  attest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"

      - name: Check fixed optimization evidence paths
        run: |
          set -euo pipefail
          python3 -m json.tool .devgod/optimization/optimization-run.json >/dev/null
          python3 -m json.tool .devgod/optimization/trials.json >/dev/null
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          receipt = json.loads(Path(".devgod/optimization/optimization-run.json").read_text())
          evidence = Path(".devgod/optimization/trials.json")
          actual = hashlib.sha256(evidence.read_bytes()).hexdigest()
          assert receipt["decision"] == "reject", "attest before changing decision to promote"
          assert receipt["evidence"]["capture_kind"] == "captured_run"
          assert receipt["evidence"]["attestation"] is None
          assert receipt["evidence"]["path"] == ".devgod/optimization/trials.json"
          assert receipt["evidence"]["sha256"] == actual
          PY

      - name: Attest captured trial evidence
        id: attest
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4
        with:
          subject-path: .devgod/optimization/trials.json

      - name: Preserve verification bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: optimization-attestation-bundle
          path: ${{ steps.attest.outputs.bundle-path }}
          if-no-files-found: error
          retention-days: 30
